<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0b0d14; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="stratGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stratGlow2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#12151e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="orangePill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#e04400"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <rect width="1600" height="900" fill="#0b0d14"/>
  <rect width="1600" height="900" fill="url(#stratGlow1)"/>
  <rect width="1600" height="900" fill="url(#stratGlow2)"/>

  <!-- Subtle Perspective Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1300" y1="0" x2="1300" y2="900"/>
    <line x1="1500" y1="0" x2="1500" y2="900"/>
    
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
  </g>

  <!-- Top Eyebrow Badge -->
  <g transform="translate(140, 110)">
    <rect width="360" height="38" rx="19" fill="#181c28" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <text x="38" y="24" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5">MARKETING STRATEGY PILLAR</text>
  </g>

  <!-- Main Headline Banner -->
  <text x="140" y="215" fill="#FFFFFF" font-size="52" font-weight="800" letter-spacing="-1">AI MARKETING STRATEGY</text>
  <text x="140" y="275" fill="#94a3b8" font-size="24" font-weight="500">Defensible Brand Authority in the Post-Search Economy</text>

  <!-- Connector Lines -->
  <path d="M 520 460 Q 640 460 720 520 T 960 520" fill="none" stroke="url(#cyanLine)" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M 960 520 Q 1060 520 1140 460" fill="none" stroke="url(#cyanLine)" stroke-width="3"/>

  <!-- Left Strategy Card: The Old Paradigm -->
  <g transform="translate(140, 360)" filter="url(#cardShadow)">
    <rect width="390" height="420" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
    
    <rect x="28" y="28" width="130" height="28" rx="14" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="44" y="47" fill="#f87171" font-size="12" font-weight="700" letter-spacing="0.5">LEGACY SEARCH</text>
    
    <text x="28" y="95" fill="#f1f5f9" font-size="22" font-weight="700">Keyword Bidding &amp; Blue Links</text>
    
    <g transform="translate(28, 125)">
      <circle cx="8" cy="14" r="4" fill="#64748b"/>
      <text x="24" y="19" fill="#94a3b8" font-size="15">Fragmented 2-4 word queries</text>
      
      <circle cx="8" cy="54" r="4" fill="#64748b"/>
      <text x="24" y="59" fill="#94a3b8" font-size="15">High zero-click attrition (60%+)</text>
      
      <circle cx="8" cy="94" r="4" fill="#64748b"/>
      <text x="24" y="99" fill="#94a3b8" font-size="15">Rising commoditized CPCs</text>

      <circle cx="8" cy="134" r="4" fill="#64748b"/>
      <text x="24" y="139" fill="#94a3b8" font-size="15">Zero buyer context captured</text>
    </g>

    <line x1="28" y1="300" x2="362" y2="300" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="340" fill="#64748b" font-size="13" font-weight="600">OUTCOME</text>
    <text x="28" y="370" fill="#cbd5e1" font-size="16" font-weight="600">Declining ROI &amp; Audience Fatigue</text>
  </g>

  <!-- Center Strategy Card: Strategic Intent Engine -->
  <g transform="translate(580, 420)" filter="url(#cardShadow)">
    <rect width="420" height="380" rx="16" fill="#131826" stroke="#38bdf8" stroke-width="2"/>
    
    <rect x="28" y="28" width="160" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8"/>
    <text x="44" y="48" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="0.5">STRATEGIC ENGINE</text>
    
    <text x="28" y="96" fill="#ffffff" font-size="22" font-weight="800">Intent Mapping &amp; Positioning</text>
    
    <g transform="translate(28, 125)">
      <!-- Metric 1 -->
      <rect width="364" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="28" fill="#94a3b8" font-size="12" font-weight="600">DECISION COMPLEXITY</text>
      <text x="18" y="50" fill="#38bdf8" font-size="18" font-weight="800">High-Consideration Dialogue</text>
      <text x="310" y="38" fill="#10b981" font-size="14" font-weight="700">+340%</text>

      <!-- Metric 2 -->
      <rect y="72" width="364" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="100" fill="#94a3b8" font-size="12" font-weight="600">BRAND AUTHORITY SIGNAL</text>
      <text x="18" y="122" fill="#ff5500" font-size="18" font-weight="800">Direct AI Recommendation</text>
      <text x="310" y="110" fill="#10b981" font-size="14" font-weight="700">Top Tier</text>
    </g>

    <text x="28" y="335" fill="#38bdf8" font-size="14" font-weight="700">AI Synthesized Trust Moat →</text>
  </g>

  <!-- Right Strategy Card: The Post-Search Economy -->
  <g transform="translate(1050, 360)" filter="url(#cardShadow)">
    <rect width="410" height="420" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 85, 0, 0.4)" stroke-width="1.5"/>
    
    <rect x="28" y="28" width="165" height="28" rx="14" fill="url(#orangePill)"/>
    <text x="44" y="47" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.5">AI-NATIVE ADVANTAGE</text>
    
    <text x="28" y="95" fill="#ffffff" font-size="22" font-weight="700">Conversational Preeminence</text>
    
    <g transform="translate(28, 125)">
      <circle cx="8" cy="14" r="4" fill="#ff5500"/>
      <text x="24" y="19" fill="#f1f5f9" font-size="15">Full buyer narrative understood</text>
      
      <circle cx="8" cy="54" r="4" fill="#ff5500"/>
      <text x="24" y="59" fill="#f1f5f9" font-size="15">Zero friction qualified handoffs</text>
      
      <circle cx="8" cy="94" r="4" fill="#ff5500"/>
      <text x="24" y="99" fill="#f1f5f9" font-size="15">Defensible knowledge footprint</text>

      <circle cx="8" cy="134" r="4" fill="#ff5500"/>
      <text x="24" y="139" fill="#f1f5f9" font-size="15">10x higher consideration capture</text>
    </g>

    <line x1="28" y1="300" x2="382" y2="300" stroke="rgba(255,255,255,0.06)"/>
    <text x="28" y="340" fill="#ff5500" font-size="13" font-weight="700">MARKET RESULT</text>
    <text x="28" y="370" fill="#ffffff" font-size="16" font-weight="700">Category Leadership &amp; High Moat</text>
  </g>
</svg>
