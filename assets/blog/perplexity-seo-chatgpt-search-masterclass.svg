    <rect y="72" width="384" height="60" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)"/>
    <text x="18" y="100" fill="#94a3b8" font-size="11" font-weight="700">SEMANTIC CLARITY</text>
    <text x="18" y="121" fill="#38bdf8" font-size="18" font-weight="800">Direct Answers in First 50 Words</text>
  </g>
