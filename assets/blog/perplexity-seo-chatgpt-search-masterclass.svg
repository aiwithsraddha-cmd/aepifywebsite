  <rect x="28" y="28" width="160" height="28" rx="14" fill="#8b5cf6"/>
  <text x="44" y="47" fill="#ffffff" font-size="12" font-weight="800">CHATGPT SEARCH</text>
  <text x="28" y="95" fill="#ffffff" font-size="22" font-weight="700">Autonomous Synthesis</text>
  <g transform="translate(28, 125)">
