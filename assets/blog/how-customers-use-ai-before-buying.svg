<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0a0d14; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="glow1" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b202e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f121a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0d14"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Ambient Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1150" y1="0" x2="1150" y2="900"/>
    <line x1="1450" y1="0" x2="1450" y2="900"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="420" x2="1600" y2="420"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(140, 105)">
    <rect width="360" height="38" rx="19" fill="#151924" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="5" fill="#38bdf8"/>
    <text x="38" y="24" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5">AI BUYER DECISION JOURNEY</text>
  </g>

  <!-- Headline -->
  <text x="140" y="210" fill="#FFFFFF" font-size="50" font-weight="800" letter-spacing="-1">HOW CUSTOMERS USE AI BEFORE BUYING</text>
  <text x="140" y="270" fill="#94a3b8" font-size="23" font-weight="500">Inside the Multi-Prompt Evaluation Loop &amp; Autonomous Vendor Vetting</text>

  <!-- Left Card -->
  <g transform="translate(140, 370)" filter="url(#shadow)">
    <rect width="400" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
    <rect x="28" y="28" width="160" height="28" rx="14" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444"/>
    <text x="44" y="47" fill="#f87171" font-size="12" font-weight="700">LEGACY FUNNEL</text>
    <text x="28" y="95" fill="#f1f5f9" font-size="22" font-weight="700">Linear Click Path</text>
    <g transform="translate(28, 125)">
      <text x="0" y="20" fill="#94a3b8" font-size="15">• 10+ browser tabs opened in parallel</text>
      <text x="0" y="55" fill="#94a3b8" font-size="15">• Gated PDF whitepapers &amp; 7-field forms</text>
      <text x="0" y="90" fill="#94a3b8" font-size="15">• SDR discovery screening calls</text>
      <text x="0" y="125" fill="#94a3b8" font-size="15">• High sales cycle friction &amp; dropoff</text>
    </g>
    <line x1="28" y1="290" x2="372" y2="290" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="330" fill="#ef4444" font-size="13" font-weight="700">BUYER EXPERIENCE</text>
    <text x="28" y="360" fill="#cbd5e1" font-size="16" font-weight="600">Passive, Slow &amp; High-Effort</text>
  </g>

  <!-- Center Card -->
  <g transform="translate(580, 410)" filter="url(#shadow)">
    <rect width="440" height="350" rx="16" fill="#121826" stroke="#38bdf8" stroke-width="2"/>
    <rect x="28" y="24" width="190" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8"/>
    <text x="44" y="43" fill="#38bdf8" font-size="12" font-weight="800">THE AI EVALUATION LOOP</text>
    <text x="28" y="90" fill="#ffffff" font-size="22" font-weight="800">4-Stage Dialogue Cycle</text>
    <g transform="translate(28, 120)">
      <rect width="384" height="60" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)"/>
      <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="700">PROMPT-LED VENDOR FILTERING</text>
      <text x="18" y="49" fill="#38bdf8" font-size="18" font-weight="800">Unbiased Multi-Turn Scrutiny</text>
      <rect y="72" width="384" height="60" rx="8" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.25)"/>
      <text x="18" y="100" fill="#94a3b8" font-size="11" font-weight="700">SYNTHETIC CONSENSUS</text>
      <text x="18" y="121" fill="#c084fc" font-size="18" font-weight="800">AI Synthesizes Peer Reviews &amp; Docs</text>
    </g>
    <text x="28" y="315" fill="#38bdf8" font-size="13" font-weight="700">Autonomous Pre-Purchase Deliberation →</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(1060, 370)" filter="url(#shadow)">
    <rect width="400" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
    <rect x="28" y="28" width="160" height="28" rx="14" fill="#8b5cf6"/>
    <text x="44" y="47" fill="#ffffff" font-size="12" font-weight="800">AI-NATIVE BUYER</text>
    <text x="28" y="95" fill="#ffffff" font-size="22" font-weight="700">Pre-Qualified Intent</text>
    <g transform="translate(28, 125)">
      <text x="0" y="20" fill="#f1f5f9" font-size="15">• Arrives with technical constraints set</text>
      <text x="0" y="55" fill="#f1f5f9" font-size="15">• Knows pricing tiers &amp; trade-offs</text>
      <text x="0" y="90" fill="#f1f5f9" font-size="15">• Bypasses generic SDR discovery</text>
      <text x="0" y="125" fill="#f1f5f9" font-size="15">• 2.4x higher pipeline velocity</text>
    </g>
    <line x1="28" y1="290" x2="372" y2="290" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="330" fill="#8b5cf6" font-size="13" font-weight="700">MARKETING IMPLICATION</text>
    <text x="28" y="360" fill="#ffffff" font-size="16" font-weight="600">Must Win Synthetic Recommendation</text>
  </g>
</svg>