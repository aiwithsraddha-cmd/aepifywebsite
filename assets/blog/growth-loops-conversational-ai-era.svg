<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0a0d14; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <radialGradient id="glow1" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#e65a02" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b202e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f121a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0d14"/>
  <rect width="1600" height="900" fill="url(#glow1)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- Ambient Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1150" y1="0" x2="1150" y2="900"/>
    <line x1="1450" y1="0" x2="1450" y2="900"/>
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="420" x2="1600" y2="420"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
  </g>

  <!-- Eyebrow Badge -->
  <g transform="translate(140, 105)">
    <rect width="440" height="38" rx="19" fill="#151924" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="5" fill="#8b5cf6"/>
    <text x="38" y="24" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.5">GROWTH MARKETING &amp; LOOPS ARCHITECTURE</text>
  </g>

  <!-- Headline -->
  <text x="140" y="210" fill="#FFFFFF" font-size="48" font-weight="800" letter-spacing="-1">GROWTH LOOPS IN THE CONVERSATIONAL ERA</text>
  <text x="140" y="270" fill="#94a3b8" font-size="23" font-weight="500">How Modern B2B Teams Replace Leaky Funnels with Self-Sustaining AI Flywheels</text>

  <!-- Left Card: Linear Funnel Breakdown -->
  <g transform="translate(140, 370)" filter="url(#shadow)">
    <rect width="400" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
    <rect x="28" y="28" width="180" height="28" rx="14" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444"/>
    <text x="44" y="47" fill="#f87171" font-size="12" font-weight="700">LINEAR FUNNEL (LEAKY)</text>
    <text x="28" y="95" fill="#f1f5f9" font-size="22" font-weight="700">Single-Cohort Model</text>
    <g transform="translate(28, 125)">
      <text x="0" y="20" fill="#94a3b8" font-size="15">• Heavy dependency on paid PPC ads</text>
      <text x="0" y="55" fill="#94a3b8" font-size="15">• Static landing page &amp; 7-field form walls</text>
      <text x="0" y="90" fill="#94a3b8" font-size="15">• 82% buyer dropoff before discovery</text>
      <text x="0" y="125" fill="#94a3b8" font-size="15">• Zero reinvestment into next cohort</text>
    </g>
    <line x1="28" y1="290" x2="372" y2="290" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="330" fill="#ef4444" font-size="13" font-weight="700">GROWTH BOTTLENECK</text>
    <text x="28" y="360" fill="#cbd5e1" font-size="16" font-weight="600">Linear Spend = Linear Pipeline</text>
  </g>

  <!-- Center Card: Synthetic Authority Loop -->
  <g transform="translate(580, 410)" filter="url(#shadow)">
    <rect width="440" height="350" rx="16" fill="#121826" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="28" y="24" width="220" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6"/>
    <text x="44" y="43" fill="#a78bfa" font-size="12" font-weight="800">SYNTHETIC AUTHORITY LOOP</text>
    <text x="28" y="90" fill="#ffffff" font-size="22" font-weight="800">Compounding AI Flywheel</text>
    <g transform="translate(28, 120)">
      <rect width="384" height="60" rx="8" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.25)"/>
      <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="700">CITATION CONVERSION VECTOR</text>
      <text x="18" y="49" fill="#c084fc" font-size="18" font-weight="800">Default Recommendation in LLMs</text>
      <rect y="72" width="384" height="60" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)"/>
      <text x="18" y="100" fill="#94a3b8" font-size="11" font-weight="700">UNIT ECONOMICS</text>
      <text x="18" y="121" fill="#10b981" font-size="18" font-weight="800">Near-Zero Marginal Inbound CAC</text>
    </g>
    <text x="28" y="315" fill="#a78bfa" font-size="13" font-weight="700">Self-Reinforcing Model Training Data →</text>
  </g>

  <!-- Right Card: Diagnostic Virality Loop -->
  <g transform="translate(1060, 370)" filter="url(#shadow)">
    <rect width="400" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(230, 90, 2, 0.4)" stroke-width="1.5"/>
    <rect x="28" y="28" width="190" height="28" rx="14" fill="#e65a02"/>
    <text x="44" y="47" fill="#ffffff" font-size="12" font-weight="800">DIAGNOSTIC VIRALITY</text>
    <text x="28" y="95" fill="#ffffff" font-size="22" font-weight="700">Interactive Pipeline Loop</text>
    <g transform="translate(28, 125)">
      <text x="0" y="20" fill="#f1f5f9" font-size="15">• Instant bespoke opportunity audit</text>
      <text x="0" y="55" fill="#f1f5f9" font-size="15">• Executive board scorecard export</text>
      <text x="0" y="90" fill="#f1f5f9" font-size="15">• Internal stakeholder viral sharing</text>
      <text x="0" y="125" fill="#f1f5f9" font-size="15">• 3.8x expansion across buying teams</text>
    </g>
    <line x1="28" y1="290" x2="372" y2="290" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="330" fill="#e65a02" font-size="13" font-weight="700">PIPELINE MULTIPLIER</text>
    <text x="28" y="360" fill="#ffffff" font-size="16" font-weight="600">3.8x Qualified Pipeline Velocity</text>
  </g>
</svg>