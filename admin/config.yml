backend:
  name: github
  repo: aiwithsraddha-cmd/aepifywebsite
  branch: main
  base_url: https://aepify.com

media_folder: "assets/blog"
public_folder: "/assets/blog"

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Articles"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL slug, e.g. what-are-chatgpt-ads" }
      - { label: "Publish Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Last Modified Date", name: "modified_date", widget: "date", format: "YYYY-MM-DD", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Aepify Team" }
      - { label: "Author Role", name: "author_role", widget: "string", default: "ChatGPT Ads Strategists" }
      - { label: "Category", name: "category", widget: "select", options: ["ChatGPT Ads", "AI Marketing", "Strategy", "Guides", "Case Studies"], default: "ChatGPT Ads" }
      - { label: "Tags", name: "tags", widget: "list", default: ["chatgpt ads", "ai advertising"] }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary for cards and search results (1-2 sentences)" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Featured Image Alt Text", name: "featured_image_alt", widget: "string", required: false }
      - { label: "Meta Title", name: "meta_title", widget: "string", hint: "SEO Title Tag (50-60 characters)" }
      - { label: "Meta Description", name: "meta_description", widget: "text", hint: "SEO Meta Description (140-160 characters)" }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }
